name: 'AO Arena Referee'
description: 'Verify agent-produced pull requests against reality. Catches hallucinated APIs, theater tests, and ghost claims with evidence-grade findings.'
author: 'AO Arena'

inputs:
  github-token:
    description: 'GitHub token with pull request read + checks write permission. Defaults to github.token.'
    required: false
    default: ${{ github.token }}
  threshold:
    description: 'Minimum trust score (0-100) required for the check to pass.'
    required: false
    default: '70'
  mode:
    description: 'Check mode: all runs every enabled check. future: targeted.'
    required: false
    default: 'all'

runs:
  using: 'composite'
  steps:
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.26'  # matches go.mod — the referee binary is built from this repo

    - name: Build referee
      shell: bash
      run: |
        cd "$GITHUB_ACTION_PATH"
        go build -o "$RUNNER_TEMP/referee" ./cmd/referee

    - name: Run referee on PR
      shell: bash
      id: referee
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
      run: |
        PR_NUMBER="${{ github.event.pull_request.number }}"
        REPO="${{ github.repository }}"
        VERDICT="$("$RUNNER_TEMP/referee" "$REPO" "pr-$PR_NUMBER" --live --json 2>&1 || true)"
        echo "$VERDICT" > "$RUNNER_TEMP/verdict.json"
        echo "verdict=$(cat "$RUNNER_TEMP/verdict.json")" >> "$GITHUB_OUTPUT"

    - name: Post verdict as check run
      shell: bash
      if: always()
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
      run: |
        PR_NUMBER="${{ github.event.pull_request.number }}"
        REPO="${{ github.repository }}"
        # The verdict JSON uses lowercase keys (trust_score) — parse it with
        # python3 (always present on GitHub runners; no bc dependency).
        SCORE=$(python3 -c "import json,sys; print(json.load(open('$RUNNER_TEMP/verdict.json'))['trust_score'])" 2>/dev/null || echo 0)
        echo "Referee score: $SCORE (threshold ${{ inputs.threshold }})"
        # --threshold makes the posted check run's conclusion respect the
        # configured minimum trust score, not just mergeability.
        "$RUNNER_TEMP/referee" "$REPO" "pr-$PR_NUMBER" --live --post --threshold ${{ inputs.threshold }} --json >/dev/null 2>&1 || true
        exit 0

branding:
  icon: 'shield'
  color: 'green'